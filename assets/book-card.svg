<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-labelledby="book-title book-desc">
  <title id="book-title">Book — Provider-agnostic AI coding agent CLI</title>
  <desc id="book-desc">Project card for Book. The left column summarises a provider-agnostic AI coding agent CLI built in TypeScript with an Ink terminal UI, file-based memory, MCP tool servers, and managed subagents. The right column shows a mock terminal session in which Book loads project instructions, delegates to an explorer subagent, applies a patch, and hands the result to a validator subagent.</desc>

  <defs>
    <linearGradient id="bk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>
    <linearGradient id="bk-term" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="bk-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="bk-glow" cx="14%" cy="4%" r="58%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bk-clip">
      <rect width="1200" height="480" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bk-clip)">
    <rect width="1200" height="480" fill="url(#bk-bg)"/>
    <rect width="1200" height="480" fill="url(#bk-glow)"/>
    <rect width="1200" height="3" fill="url(#bk-accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="14" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Left column -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="132" height="24" rx="4" fill="#064E3B"/>
    <text x="12" y="16" fill="#34D399" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" letter-spacing="1.2">PROJECT / 01</text>

    <text x="0" y="76" fill="#F8FAFC" font-family="'Inter',system-ui,sans-serif" font-size="42" font-weight="800" letter-spacing="-1">Book CLI</text>
    <text x="0" y="106" fill="#34D399" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14.5" font-weight="600">Provider-Agnostic AI Coding Agent</text>

    <text fill="#94A3B8" font-family="'Inter',system-ui,sans-serif" font-size="14">
      <tspan x="0" y="144">An autonomous terminal agent for real development work.</tspan>
      <tspan x="0" y="166">Persistent sessions, file-based memory, MCP tool servers,</tspan>
      <tspan x="0" y="188">and managed subagents that run in isolated worktrees.</tspan>
    </text>

    <g transform="translate(0, 216)" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#CBD5E1">
      <circle cx="5" cy="11" r="3" fill="#10B981"/>
      <text x="18" y="15">Ink / React TUI plus a headless print mode for CI</text>
      <circle cx="5" cy="39" r="3" fill="#10B981"/>
      <text x="18" y="43">File-based memory with an explicit approval flow</text>
      <circle cx="5" cy="67" r="3" fill="#10B981"/>
      <text x="18" y="71">MCP tool servers and a searchable tool catalog</text>
    </g>

    <g transform="translate(0, 324)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="96" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="48" y="19.5" fill="#38BDF8" text-anchor="middle">TypeScript</text>
      <rect x="106" y="0" width="74" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="143" y="19.5" fill="#F43F5E" text-anchor="middle">Ink TUI</text>
      <rect x="190" y="0" width="52" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="216" y="19.5" fill="#34D399" text-anchor="middle">MCP</text>
      <rect x="252" y="0" width="76" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="290" y="19.5" fill="#F59E0B" text-anchor="middle">Node.js</text>
    </g>
  </g>

  <!-- Right column: terminal session -->
  <g transform="translate(540, 45)">
    <rect width="600" height="390" rx="12" fill="url(#bk-term)" stroke="#334155" stroke-width="1"/>

    <path d="M 0 12 A 12 12 0 0 1 12 0 L 588 0 A 12 12 0 0 1 600 12 L 600 38 L 0 38 Z" fill="#090D16"/>
    <line x1="0" y1="38" x2="600" y2="38" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#EF4444"/>
    <circle cx="41" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="58" cy="19" r="5" fill="#10B981"/>
    <text x="300" y="23.5" fill="#64748B" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" text-anchor="middle">book — session active</text>

    <g transform="translate(25, 60)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13">
      <path d="M 1 6 L 8 12.5 L 1 19" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="15" fill="#F8FAFC">book -p </text>
      <text x="82" y="15" fill="#38BDF8">"Refactor auth router, add tests"</text>

      <text x="0" y="45" fill="#10B981" font-weight="600">[book v0.1.1]</text>
      <text x="112" y="45" fill="#94A3B8" font-size="12">Provider: Anthropic · OpenAI-compatible</text>

      <text x="0" y="76" fill="#38BDF8">ℹ</text>
      <text x="18" y="76" fill="#CBD5E1" font-size="12">Loaded AGENTS.md, CLAUDE.md and the project memory index</text>

      <rect x="0" y="94" width="550" height="80" rx="6" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
      <text x="15" y="118" fill="#F59E0B" font-weight="600" font-size="12.5">⚡ subagent: explorer</text>
      <path d="M 17 130 L 17 137 L 25 137" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 22 134 L 25 137 L 22 140" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="141" fill="#94A3B8" font-size="12">ToolSearch → <tspan fill="#38BDF8">Grep</tspan> { pattern: "handleAuth" }</text>
      <text x="15" y="160" fill="#34D399" font-size="12">✔ Reported 4 call sites in src/auth/router.ts</text>

      <text x="0" y="202" fill="#34D399">✔</text>
      <text x="18" y="202" fill="#F8FAFC" font-size="12.5">Patch applied to <tspan fill="#38BDF8">src/auth/router.ts</tspan></text>

      <text x="0" y="230" fill="#34D399">✔</text>
      <text x="18" y="230" fill="#F8FAFC" font-size="12.5">Handed off to <tspan fill="#F59E0B">validator</tspan> in an isolated worktree</text>

      <path d="M 1 257 L 8 263.5 L 1 270" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="266" fill="#94A3B8" font-size="12.5">Ready for the next instruction</text>
      <rect x="268" y="254" width="8" height="15" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <line x1="0" y1="352" x2="600" y2="352" stroke="#334155" stroke-width="1"/>
    <path d="M 0 352 L 600 352 L 600 378 A 12 12 0 0 1 588 390 L 12 390 A 12 12 0 0 1 0 378 Z" fill="#090D16"/>
    <circle cx="24" cy="371" r="4" fill="#10B981"/>
    <text x="36" y="375" fill="#34D399" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="600">SESSION SAVED</text>
    <text x="152" y="375" fill="#64748B" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11">/rewind · /compact</text>
    <text x="576" y="375" fill="#38BDF8" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" text-anchor="end">letrquan/book</text>
  </g>
</svg>
