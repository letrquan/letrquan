<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 230" role="img" aria-labelledby="title desc">
  <title id="title">Book</title>
  <desc id="desc">A provider-agnostic AI coding agent with a rich terminal interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F20" />
      <stop offset="1" stop-color="#15112B" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#A78BFA" fill-opacity="0.12" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="568" height="228" rx="22" fill="url(#bg)" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="2" />
  <rect x="1" y="1" width="568" height="228" rx="22" fill="url(#dots)" />
  <rect x="28" y="28" width="7" height="122" rx="3.5" fill="url(#line)" />
  <text x="58" y="56" fill="#A78BFA" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">AI CODING AGENT · TERMINAL UI</text>
  <text x="56" y="100" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="3">BOOK</text>
  <text x="56" y="130" fill="#AAB6CA" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Provider-agnostic coding agent with sessions,</text>
  <text x="56" y="151" fill="#AAB6CA" font-family="'Segoe UI', Arial, sans-serif" font-size="15">memory, MCP, and managed agents.</text>
  <g font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.7">
    <rect x="56" y="178" width="92" height="26" rx="13" fill="#251D48" stroke="#8B5CF6" stroke-opacity="0.7" />
    <text x="102" y="195" text-anchor="middle" fill="#DDD6FE">TYPESCRIPT</text>
    <rect x="158" y="178" width="60" height="26" rx="13" fill="#14243A" stroke="#22D3EE" stroke-opacity="0.55" />
    <text x="188" y="195" text-anchor="middle" fill="#A5F3FC">INK</text>
    <rect x="228" y="178" width="63" height="26" rx="13" fill="#1B233A" stroke="#64748B" stroke-opacity="0.65" />
    <text x="259.5" y="195" text-anchor="middle" fill="#CBD5E1">MCP</text>
  </g>
  <g transform="translate(466 76)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-42" y="-34" width="84" height="68" rx="10" fill="#10182C" stroke="#8B5CF6" stroke-width="2" />
    <path d="M-22 -12 L-8 0 L-22 12 M1 12 H23" stroke="#67E8F9" stroke-width="4" />
    <circle cx="42" cy="-34" r="7" fill="#A78BFA" stroke="none" />
  </g>
</svg>
