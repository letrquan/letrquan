<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-labelledby="vv-title vv-desc">
  <title id="vv-title">V Voice — Lightweight Voice-to-Text Windows Widget</title>
  <desc id="vv-desc">Project dossier and desktop widget mockup for V Voice, a voice-to-text dictation widget powered by Rust, Tauri 2, and Whisper AI.</desc>

  <defs>
    <linearGradient id="vv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="vv-widget-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="480" fill="url(#vv-bg)" rx="12" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="480" rx="12" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.3"/>

  <!-- Left Column: Details & Information -->
  <g transform="translate(60, 55)">
    <!-- Kicker / Tag -->
    <rect x="0" y="0" width="190" height="24" rx="4" fill="#78350F" opacity="0.6"/>
    <text x="12" y="16" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">PROJECT // 03</text>

    <!-- Title -->
    <text x="0" y="72" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">V Voice</text>
    <text x="0" y="102" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600">Lightweight Windows Voice-to-Text</text>

    <!-- Description -->
    <text x="0" y="138" fill="#94A3B8" font-family="sans-serif" font-size="14" leading="22">
      <tspan x="0" y="138">A minimalist Windows desktop widget powered by local or</tspan>
      <tspan x="0" y="160">cloud Whisper AI models. Offers global hotkey dictation</tspan>
      <tspan x="0" y="182">with near-zero latency and minimal memory footprint.</tspan>
    </text>

    <!-- Bullet Highlights -->
    <g transform="translate(0, 210)">
      <circle cx="6" cy="12" r="3" fill="#F59E0B"/>
      <text x="18" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="13">High-performance Rust core built with Tauri 2</text>

      <circle cx="6" cy="38" r="3" fill="#F59E0B"/>
      <text x="18" y="42" fill="#CBD5E1" font-family="sans-serif" font-size="13">Supports local Whisper models &amp; API fallbacks</text>

      <circle cx="6" cy="64" r="3" fill="#F59E0B"/>
      <text x="18" y="68" fill="#CBD5E1" font-family="sans-serif" font-size="13">Global hotkey trigger &amp; instant text insertion</text>
    </g>

    <!-- Stack Pills -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="75" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="37" y="19" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Rust</text>

      <rect x="85" y="0" width="95" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="132" y="19" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Tauri 2</text>

      <rect x="190" y="0" width="85" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="232" y="19" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">React</text>

      <rect x="285" y="0" width="115" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="342" y="19" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Whisper AI</text>
    </g>
  </g>

  <!-- Right Column: Windows Desktop Widget UI Mockup -->
  <g transform="translate(540, 45)">
    <!-- Container -->
    <rect width="600" height="390" rx="10" fill="#090D16" stroke="#334155" stroke-width="1.5"/>

    <!-- Desktop Grid Background -->
    <rect x="15" y="15" width="570" height="360" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

    <!-- Floating Widget Window (Centered) -->
    <g transform="translate(60, 50)">
      <!-- Main Widget Box with amber border glow -->
      <rect width="480" height="280" rx="12" fill="url(#vv-widget-bg)" stroke="#F59E0B" stroke-width="2"/>

      <!-- Window Header Bar -->
      <path d="M 0 12 A 12 12 0 0 1 12 0 L 468 0 A 12 12 0 0 1 480 12 L 480 40 L 0 40 Z" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="20" r="5" fill="#EF4444"/>
      <circle cx="42" cy="20" r="5" fill="#F59E0B"/>
      <circle cx="59" cy="20" r="5" fill="#10B981"/>
      <text x="240" y="24" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">V Voice — Dictation Active</text>

      <!-- Hotkey Indicator Badge -->
      <rect x="340" y="10" width="125" height="20" rx="4" fill="#1E293B"/>
      <text x="402" y="24" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">Win + Alt + V</text>

      <!-- Audio Waveform Visualization Bar -->
      <g transform="translate(30, 65)">
        <text x="0" y="20" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">● RECORDING AUDIO</text>
        <text x="420" y="20" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Whisper.cpp (Local)</text>

        <!-- Dynamic Audio Equalizer Bars -->
        <g transform="translate(0, 35)">
          <rect x="0" y="10" width="8" height="30" rx="3" fill="#F59E0B"/>
          <rect x="14" y="0" width="8" height="50" rx="3" fill="#EF4444"/>
          <rect x="28" y="18" width="8" height="34" rx="3" fill="#F59E0B"/>
          <rect x="42" y="5" width="8" height="42" rx="3" fill="#34D399"/>
          <rect x="56" y="22" width="8" height="28" rx="3" fill="#F59E0B"/>
          <rect x="70" y="8" width="8" height="44" rx="3" fill="#EF4444"/>
          <rect x="84" y="25" width="8" height="22" rx="3" fill="#F59E0B"/>
          <rect x="98" y="2" width="8" height="48" rx="3" fill="#38BDF8"/>
          <rect x="112" y="15" width="8" height="35" rx="3" fill="#F59E0B"/>
          <rect x="126" y="20" width="8" height="30" rx="3" fill="#F59E0B"/>
          <rect x="140" y="5" width="8" height="45" rx="3" fill="#EF4444"/>
          <rect x="154" y="25" width="8" height="25" rx="3" fill="#F59E0B"/>
          <rect x="168" y="10" width="8" height="38" rx="3" fill="#34D399"/>
          <rect x="182" y="0" width="8" height="50" rx="3" fill="#EF4444"/>
          <rect x="196" y="15" width="8" height="35" rx="3" fill="#F59E0B"/>
          <rect x="210" y="8" width="8" height="42" rx="3" fill="#38BDF8"/>
          <rect x="224" y="20" width="8" height="30" rx="3" fill="#F59E0B"/>
          <rect x="238" y="5" width="8" height="45" rx="3" fill="#EF4444"/>
          <rect x="252" y="28" width="8" height="22" rx="3" fill="#F59E0B"/>
          <rect x="266" y="12" width="8" height="38" rx="3" fill="#34D399"/>
          <rect x="280" y="2" width="8" height="48" rx="3" fill="#EF4444"/>
          <rect x="294" y="18" width="8" height="32" rx="3" fill="#F59E0B"/>
          <rect x="308" y="10" width="8" height="40" rx="3" fill="#38BDF8"/>
          <rect x="322" y="22" width="8" height="26" rx="3" fill="#F59E0B"/>
          <rect x="336" y="6" width="8" height="44" rx="3" fill="#EF4444"/>
          <rect x="350" y="15" width="8" height="35" rx="3" fill="#34D399"/>

          <!-- Animated equalizer simulation pulse -->
          <circle cx="390" cy="25" r="16" fill="#F59E0B" opacity="0.2">
            <animate attributeName="r" values="16;24;16" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="390" cy="25" r="10" fill="#F59E0B"/>
        </g>

        <!-- Transcription Preview Output -->
        <rect x="0" y="115" width="420" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="136" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="500">"Building high-performance desktop tools with Rust &amp; Tauri..."</text>
        <text x="12" y="154" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">↳ Transcribed in 42ms • Pasted into active window</text>
      </g>

      <!-- Widget Footer -->
      <line x1="0" y1="245" x2="480" y2="245" stroke="#334155" stroke-width="1"/>
      <text x="20" y="265" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">● LATENCY: 42ms</text>
      <text x="180" y="265" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">RAM: 28MB</text>
      <text x="460" y="265" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">letrquan/v-voice-claude</text>
    </g>
  </g>
</svg>
