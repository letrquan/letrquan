<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 230" role="img" aria-labelledby="title desc">
  <title id="title">V Voice</title>
  <desc id="desc">A Windows voice-to-text desktop widget powered by local or cloud Whisper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110C1C" />
      <stop offset="1" stop-color="#171129" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F472B6" fill-opacity="0.1" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="568" height="228" rx="22" fill="url(#bg)" stroke="#A855F7" stroke-opacity="0.5" stroke-width="2" />
  <rect x="1" y="1" width="568" height="228" rx="22" fill="url(#dots)" />
  <rect x="28" y="28" width="7" height="122" rx="3.5" fill="url(#line)" />
  <text x="58" y="56" fill="#F9A8D4" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.7">VOICE-TO-TEXT FOR WINDOWS</text>
  <text x="56" y="100" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="3">V VOICE</text>
  <text x="56" y="130" fill="#AAB6CA" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Fast dictation with local or cloud Whisper,</text>
  <text x="56" y="151" fill="#AAB6CA" font-family="'Segoe UI', Arial, sans-serif" font-size="15">wrapped in a lightweight Tauri desktop widget.</text>
  <g font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.7">
    <rect x="56" y="178" width="58" height="26" rx="13" fill="#2D1729" stroke="#F472B6" stroke-opacity="0.65" />
    <text x="85" y="195" text-anchor="middle" fill="#FBCFE8">RUST</text>
    <rect x="124" y="178" width="77" height="26" rx="13" fill="#281D3D" stroke="#A78BFA" stroke-opacity="0.65" />
    <text x="162.5" y="195" text-anchor="middle" fill="#DDD6FE">TAURI 2</text>
    <rect x="211" y="178" width="71" height="26" rx="13" fill="#171F36" stroke="#64748B" stroke-opacity="0.65" />
    <text x="246.5" y="195" text-anchor="middle" fill="#CBD5E1">REACT</text>
  </g>
  <g transform="translate(470 78)" fill="none" stroke-linecap="round">
    <rect x="-20" y="-43" width="40" height="76" rx="20" fill="#24152E" stroke="#F472B6" stroke-width="3" />
    <path d="M-35 8 C-35 35 35 35 35 8" stroke="#C4B5FD" stroke-width="4" />
    <path d="M0 35 V54 M-18 54 H18" stroke="#C4B5FD" stroke-width="4" />
    <path d="M-7 -24 V16 M7 -18 V10" stroke="#FBCFE8" stroke-width="3" />
    <circle cx="0" cy="-5" r="45" stroke="#A855F7" stroke-opacity="0.18" stroke-width="2" />
  </g>
</svg>
