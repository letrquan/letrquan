  <g font-family="sans-serif" fill="#121212">
    <text x="72" y="81" font-size="13" font-weight="700" letter-spacing="2">RELEASE 03 / DESKTOP UTILITY</text>
    <text x="1128" y="81" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2">ACTIVE RECORD</text>
    <text x="72" y="220" font-size="112" font-weight="900" letter-spacing="-6">V VOICE</text>
    <text x="78" y="272" font-size="21" font-weight="700">Fast Windows dictation with local or cloud Whisper.</text>
