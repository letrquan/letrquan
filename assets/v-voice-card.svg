<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">V Voice</title>
  <desc id="desc">Project dossier for V Voice, a Windows voice-to-text desktop widget powered by local or cloud Whisper.</desc>
  <rect width="1200" height="500" fill="#F3F1E8"/>
  <path d="M42 42H1158M42 458H1158" stroke="#121212" stroke-width="2"/>
