<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-labelledby="header-title header-desc">
  <title id="header-title">Zain — Software Engineer &amp; Product Builder</title>
  <desc id="header-desc">A dark terminal window. The left pane declares a developer profile in TypeScript: name Zain, role Software Engineer and Product Builder, focus on AI agents, browser utilities, and desktop apps. The right pane lists three selected projects — Book CLI in TypeScript, Better Picture in JavaScript, and V Voice in Rust.</desc>

  <defs>
    <linearGradient id="hd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>
    <linearGradient id="hd-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121B2C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hd-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="hd-glow" cx="18%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hd-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.35"/>
    </pattern>
    <clipPath id="hd-clip">
      <rect width="1200" height="440" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hd-clip)">
    <rect width="1200" height="440" fill="url(#hd-bg)"/>
    <rect width="1200" height="440" fill="url(#hd-grid)"/>
    <rect width="1200" height="440" fill="url(#hd-glow)"/>
    <rect width="1200" height="3" fill="url(#hd-accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="14" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Terminal window -->
  <rect x="48" y="44" width="1104" height="352" rx="12" fill="url(#hd-panel)" stroke="#334155" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M 48 56 A 12 12 0 0 1 60 44 L 1140 44 A 12 12 0 0 1 1152 56 L 1152 84 L 48 84 Z" fill="#0F172A"/>
  <line x1="48" y1="84" x2="1152" y2="84" stroke="#334155" stroke-width="1"/>
  <circle cx="76" cy="64" r="5.5" fill="#EF4444"/>
  <circle cx="96" cy="64" r="5.5" fill="#F59E0B"/>
  <circle cx="116" cy="64" r="5.5" fill="#10B981"/>

  <rect x="150" y="50" width="134" height="28" rx="6" fill="#131C2E" stroke="#334155" stroke-width="1"/>
  <circle cx="166" cy="64" r="3.5" fill="#38BDF8"/>
  <text x="178" y="69" fill="#38BDF8" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="600">developer.ts</text>
  <text x="300" y="69" fill="#64748B" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12.5">zain@workspace ~</text>

  <!-- Left pane: profile as code -->
  <g transform="translate(80, 106)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13">
    <text>
      <tspan x="0" y="18" fill="#F43F5E">const</tspan><tspan fill="#38BDF8"> developer</tspan><tspan fill="#94A3B8"> = {</tspan>
      <tspan x="18" y="44" fill="#E2E8F0">name</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"Zain"</tspan><tspan fill="#94A3B8">,</tspan>
      <tspan x="18" y="70" fill="#E2E8F0">role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"Software Engineer &amp; Product Builder"</tspan><tspan fill="#94A3B8">,</tspan>
      <tspan x="18" y="96" fill="#E2E8F0">focus</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#F59E0B">"AI Agents"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#F59E0B">"Browser Utilities"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#F59E0B">"Desktop Apps"</tspan><tspan fill="#94A3B8">],</tspan>
      <tspan x="18" y="122" fill="#E2E8F0">stack</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#38BDF8">"TypeScript"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">"Rust"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">"React"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">"Tauri 2"</tspan><tspan fill="#94A3B8">],</tspan>
      <tspan x="18" y="148" fill="#E2E8F0">principle</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"Useful tools, sharp interfaces, solid foundations"</tspan>
      <tspan x="0" y="174" fill="#94A3B8">};</tspan>
    </text>

    <g transform="translate(0, 208)">
      <path d="M 1 5 L 8 11.5 L 1 18" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="14" fill="#E2E8F0" font-size="13">zain --status</text>
      <text x="122" y="14" fill="#38BDF8" font-size="13">--building</text>
      <rect x="212" y="2" width="8" height="15" fill="#38BDF8">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Right pane: selected work -->
  <g transform="translate(624, 106)">
    <text x="0" y="14" fill="#64748B" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">// SELECTED WORK</text>

    <g transform="translate(0, 32)">
      <rect width="496" height="62" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="26" cy="31" r="4.5" fill="#10B981"/>
      <text x="44" y="27" fill="#F8FAFC" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700">Book CLI</text>
      <rect x="394" y="14" width="86" height="20" rx="4" fill="#1E293B"/>
      <text x="437" y="28" fill="#38BDF8" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
      <text x="44" y="47" fill="#94A3B8" font-family="'Inter',system-ui,sans-serif" font-size="12">Provider-agnostic AI coding agent · Ink TUI · MCP</text>
    </g>

    <g transform="translate(0, 106)">
      <rect width="496" height="62" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="26" cy="31" r="4.5" fill="#38BDF8"/>
      <text x="44" y="27" fill="#F8FAFC" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700">Better Picture</text>
      <rect x="394" y="14" width="86" height="20" rx="4" fill="#1E293B"/>
      <text x="437" y="28" fill="#F59E0B" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="600" text-anchor="middle">JavaScript</text>
      <text x="44" y="47" fill="#94A3B8" font-family="'Inter',system-ui,sans-serif" font-size="12">Caption-aware floating mini-player for Chrome &amp; Edge</text>
    </g>

    <g transform="translate(0, 180)">
      <rect width="496" height="62" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="26" cy="31" r="4.5" fill="#F59E0B"/>
      <text x="44" y="27" fill="#F8FAFC" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700">V Voice</text>
      <rect x="433" y="14" width="47" height="20" rx="4" fill="#1E293B"/>
      <text x="456" y="28" fill="#F43F5E" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="600" text-anchor="middle">Rust</text>
      <text x="44" y="47" fill="#94A3B8" font-family="'Inter',system-ui,sans-serif" font-size="12">Windows dictation widget powered by Whisper</text>
    </g>
  </g>

  <!-- Status bar -->
  <line x1="48" y1="358" x2="1152" y2="358" stroke="#334155" stroke-width="1"/>
  <path d="M 48 358 L 1152 358 L 1152 384 A 12 12 0 0 1 1140 396 L 60 396 A 12 12 0 0 1 48 384 Z" fill="#0F172A"/>
  <circle cx="74" cy="377" r="4" fill="#10B981"/>
  <text x="86" y="381" fill="#34D399" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="600">OPEN TO COLLABORATION</text>
  <text x="252" y="381" fill="#64748B" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11">TypeScript · Rust · JavaScript</text>
  <text x="1126" y="381" fill="#38BDF8" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" text-anchor="end">github.com/letrquan</text>
</svg>
