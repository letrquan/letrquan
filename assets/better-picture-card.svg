<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-labelledby="bp-title bp-desc">
  <title id="bp-title">Better Picture — Caption-Aware Floating Mini-Player</title>
  <desc id="bp-desc">Project dossier and browser extension mockup for Better Picture, a floating mini-player with subtitle syncing for Chrome and Edge.</desc>

  <defs>
    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bp-browser-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="pip-video-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="480" fill="url(#bp-bg)" rx="12" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="480" rx="12" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>

  <!-- Left Column: Details & Information -->
  <g transform="translate(60, 55)">
    <!-- Kicker / Tag -->
    <rect x="0" y="0" width="175" height="24" rx="4" fill="#0369A1" opacity="0.5"/>
    <text x="12" y="16" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">PROJECT // 02</text>

    <!-- Title -->
    <text x="0" y="72" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Better Picture</text>
    <text x="0" y="102" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600">Caption-Aware Floating Mini-Player</text>

    <!-- Description -->
    <text x="0" y="138" fill="#94A3B8" font-family="sans-serif" font-size="14" leading="22">
      <tspan x="0" y="138">A browser extension for Chrome &amp; Microsoft Edge that</tspan>
      <tspan x="0" y="160">elevates Picture-in-Picture mode by syncing captions,</tspan>
      <tspan x="0" y="182">subtitles, and interactive controls in one floating window.</tspan>
    </text>

    <!-- Bullet Highlights -->
    <g transform="translate(0, 210)">
      <circle cx="6" cy="12" r="3" fill="#38BDF8"/>
      <text x="18" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="13">Synced live subtitle track directly inside PiP frame</text>

      <circle cx="6" cy="38" r="3" fill="#38BDF8"/>
      <text x="18" y="42" fill="#CBD5E1" font-family="sans-serif" font-size="13">Manifest V3 compliant (Chrome &amp; Edge)</text>

      <circle cx="6" cy="64" r="3" fill="#38BDF8"/>
      <text x="18" y="68" fill="#CBD5E1" font-family="sans-serif" font-size="13">Fully automated E2E test suite using Playwright</text>
    </g>

    <!-- Stack Pills -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="100" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="50" y="19" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">JavaScript</text>

      <rect x="110" y="0" width="115" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="167" y="19" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Manifest V3</text>

      <rect x="235" y="0" width="105" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="287" y="19" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Playwright</text>

      <rect x="350" y="0" width="90" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="395" y="19" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Chrome/Edge</text>
    </g>
  </g>

  <!-- Right Column: Browser & Floating PiP Window UI Mockup -->
  <g transform="translate(540, 45)">
    <!-- Main Browser Container -->
    <rect width="600" height="390" rx="10" fill="url(#bp-browser-bg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Browser Address Bar & Chrome -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 590 0 A 10 10 0 0 1 600 10 L 600 42 L 0 42 Z" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="21" r="5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="21" r="5" fill="#10B981"/>

    <!-- Address Pill -->
    <rect x="90" y="9" width="380" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="105" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">https://video-platform.com/watch?v=demo</text>

    <!-- Extension Icon Indicator -->
    <rect x="480" y="9" width="105" height="24" rx="6" fill="#0284C7"/>
    <text x="532" y="25" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">⚡ CC PIP ON</text>

    <!-- Video Background simulation inside browser -->
    <g transform="translate(25, 60)">
      <!-- Main Web page video area (dimmed) -->
      <rect width="550" height="270" rx="6" fill="#1E293B" opacity="0.4"/>
      <text x="275" y="140" fill="#64748B" font-family="sans-serif" font-size="14" text-anchor="middle">Background Web Video Player (PiP Active)</text>

      <!-- Floating Picture-in-Picture Overlay Window -->
      <g transform="translate(180, 40)">
        <!-- PiP Window Box with glow -->
        <rect width="350" height="200" rx="10" fill="url(#pip-video-bg)" stroke="#38BDF8" stroke-width="2"/>

        <!-- Video visual mockup graphics inside PiP -->
        <path d="M 30 110 Q 90 40 175 90 T 320 60" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.7"/>
        <path d="M 30 130 Q 120 70 210 120 T 320 100" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.5"/>

        <!-- Playhead / Waveform graphics -->
        <circle cx="175" cy="90" r="6" fill="#38BDF8"/>

        <!-- Subtitle Box Overlay (The core value proposition!) -->
        <rect x="25" y="130" width="300" height="32" rx="6" fill="#0F172A" opacity="0.92" stroke="#334155" stroke-width="1"/>
        <text x="150" y="151" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">[CC] Caption synced directly inside PiP frame</text>

        <!-- PiP Controls Bar at bottom -->
        <rect x="0" y="170" width="350" height="30" fill="#090D16" rx="0"/>
        <path d="M 0 170 L 350 170 L 350 190 A 10 10 0 0 1 340 200 L 10 200 A 10 10 0 0 1 0 190 Z" fill="#090D16"/>

        <!-- Play icon -->
        <polygon points="25,180 25,190 35,185" fill="#38BDF8"/>
        <!-- Timeline bar -->
        <rect x="50" y="183" width="220" height="4" rx="2" fill="#334155"/>
        <rect x="50" y="183" width="130" height="4" rx="2" fill="#38BDF8"/>
        <circle cx="180" cy="185" r="4" fill="#38BDF8"/>
        <!-- Subtitle toggle badge -->
        <text x="325" y="189" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="end">CC 100%</text>
      </g>
    </g>

    <!-- Browser Footer Bar -->
    <path d="M 0 350 L 600 350 L 600 380 A 10 10 0 0 1 590 390 L 10 390 A 10 10 0 0 1 0 380 Z" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="370" r="4" fill="#38BDF8"/>
    <text x="38" y="374" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">EXTENSION ACTIVE</text>
    <text x="170" y="374" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">Auto-sync: On</text>
    <text x="575" y="374" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">letrquan/better-picture</text>
  </g>
</svg>
