<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 230" role="img" aria-labelledby="title desc">
  <title id="title">Better Picture</title>
  <desc id="desc">A caption-aware floating mini-player for Chrome and Microsoft Edge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141C" />
      <stop offset="1" stop-color="#111D29" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22D3EE" fill-opacity="0.1" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="568" height="228" rx="22" fill="url(#bg)" stroke="#0891B2" stroke-opacity="0.55" stroke-width="2" />
  <rect x="1" y="1" width="568" height="228" rx="22" fill="url(#dots)" />
  <rect x="28" y="28" width="7" height="122" rx="3.5" fill="url(#line)" />
  <text x="58" y="56" fill="#67E8F9" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">CAPTION-AWARE MINI-PLAYER</text>
  <text x="56" y="100" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1.5">BETTER PICTURE</text>
  <text x="56" y="130" fill="#AAB6CA" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Floating video, subtitles, and focused controls</text>
  <text x="56" y="151" fill="#AAB6CA" font-family="'Segoe UI', Arial, sans-serif" font-size="15">for Chrome and Microsoft Edge.</text>
  <g font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.7">
    <rect x="56" y="178" width="92" height="26" rx="13" fill="#102C36" stroke="#22D3EE" stroke-opacity="0.65" />
    <text x="102" y="195" text-anchor="middle" fill="#A5F3FC">JAVASCRIPT</text>
    <rect x="158" y="178" width="58" height="26" rx="13" fill="#2D2415" stroke="#F59E0B" stroke-opacity="0.65" />
    <text x="187" y="195" text-anchor="middle" fill="#FDE68A">MV3</text>
    <rect x="226" y="178" width="94" height="26" rx="13" fill="#182739" stroke="#64748B" stroke-opacity="0.65" />
    <text x="273" y="195" text-anchor="middle" fill="#CBD5E1">PLAYWRIGHT</text>
  </g>
  <g transform="translate(470 78)">
    <rect x="-48" y="-35" width="96" height="70" rx="11" fill="#0B1D27" stroke="#22D3EE" stroke-width="2" />
    <path d="M-13 -16 L20 0 L-13 16 Z" fill="#F8FAFC" />
    <rect x="-32" y="22" width="64" height="5" rx="2.5" fill="#334155" />
    <rect x="-32" y="22" width="38" height="5" rx="2.5" fill="#F59E0B" />
    <rect x="-34" y="47" width="68" height="16" rx="8" fill="#17323D" stroke="#22D3EE" stroke-opacity="0.45" />
    <text x="0" y="58" text-anchor="middle" fill="#A5F3FC" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700">CAPTIONS ON</text>
  </g>
</svg>
